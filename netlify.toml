# Netlify config — kéo thả hoặc deploy từ GitHub đều dùng được
[build]
  publish = "."

# Trang chủ: mở keode.netlify.app là vào thẳng web (file chính là keo-de.html)
[[redirects]]
  from = "/"
  to = "/keo-de.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
